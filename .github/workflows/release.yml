name: Release

# Triggers:
# 1) Push of a version tag, e.g.:
#      git tag v1.3.0
#      git push origin main v1.3.0
#    -> builds the ZIP and creates the release. Commit messages and normal
#       pushes do not trigger it.
# 2) Manual run (Actions tab -> Release -> Run workflow):
#    - "tag" empty:  DRY RUN. Builds the ZIP from the selected branch and lists
#                    its content in the log. No release is created.
#    - "tag" filled: checks out that EXISTING tag and creates the release for it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.3.0). Leave empty for a dry run without release."
        required: false
        default: ""

permissions:
  contents: write # needed to create the release and attach the ZIP

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Determine tag and check it against the manifest version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          MANIFEST_VERSION="$(jq -r .version manifest.json)"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_TAG" ]; then
            echo "Dry run: building v$MANIFEST_VERSION from $REF_NAME, no release will be created"
            echo "TAG=v$MANIFEST_VERSION" >> "$GITHUB_ENV"
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          else
            TAG="${INPUT_TAG:-$REF_NAME}"
            if [ "${TAG#v}" != "$MANIFEST_VERSION" ]; then
              echo "::error::Tag $TAG does not match version $MANIFEST_VERSION in manifest.json"
              exit 1
            fi
            echo "TAG=$TAG" >> "$GITHUB_ENV"
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Build ZIP (only the files the extension needs)
        run: |
          NAME="my-dashboard-newtab"
          mkdir -p "dist/$NAME"

          # Required files: the build fails if one is missing
          cp manifest.json index.html style.css script.js storage.js update-check.js "dist/$NAME/"
          cp -r icons "dist/$NAME/"

          # Optional: only the 8bit theme uses the font
          if [ -f Ndot-55.otf ]; then
            cp Ndot-55.otf "dist/$NAME/"
          else
            echo "::warning::Ndot-55.otf not found, the ZIP is built without it"
          fi

          cd dist
          zip -r "../$NAME-$TAG.zip" "$NAME"

      - name: Show ZIP content
        run: unzip -l "my-dashboard-newtab-$TAG.zip"

      - name: Create release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "my-dashboard-newtab-$TAG.zip" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes